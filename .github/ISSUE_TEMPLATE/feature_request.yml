name: Feature request
description: Suggest a change or an addition.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check the Roadmap section of the README. Team sharing and Gmail/Slack connectors are already planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today? Describe the situation rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like terum-memory to do? Include example commands or MCP tool calls if that helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you could solve this, including workarounds you use now.
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Fit with the project's constraints
      description: terum-memory is local-first. Please confirm the proposal keeps these properties, or explain in the proposal why it should not.
      options:
        - label: Works without a server or an account
        - label: Does not send raw prompts or responses off the machine
        - label: Runs on Node 20
